server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    # Docker's embedded DNS server. Needed so the fastcgi_pass below
    # re-resolves "app" on every request (via the $upstream_app variable)
    # instead of caching whatever IP it had the moment nginx started —
    # that default caching is what caused every "connection refused"/502
    # we hit any time the app container restarted or was recreated.
    resolver 127.0.0.11 valid=10s;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app;
        fastcgi_pass $upstream_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        # Default 4-8k buffers are too small once a response carries several
        # encrypted cookies at once (session + XSRF-TOKEN) — without this,
        # nginx rejects the response with "upstream sent too big header".
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
