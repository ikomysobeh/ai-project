services:
  # --- Laravel bridge/API ---
  app:
    build:
      context: ./ai-bridge
      dockerfile: Dockerfile
    container_name: tokenforge_app
    restart: unless-stopped
    env_file:
      - ./ai-bridge/.env
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - ./ai-bridge:/var/www/html
      - ai_bridge_vendor:/var/www/html/vendor
      # Read-only: lets the in-app "Documentation" page render the real
      # docs/ markdown instead of a duplicated copy baked into the app.
      - ./docs:/docs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [tokenforge]

  nginx:
    image: nginx:alpine
    container_name: tokenforge_nginx
    restart: unless-stopped
    ports:
      # Loopback-only: on a shared VPS, a host-level Nginx (with its own
      # domain + TLS) reverse-proxies to this port. Never expose this
      # container directly to the internet — see
      # docs/13-production-deployment.md.
      - "127.0.0.1:8080:80"
    volumes:
      - ./ai-bridge:/var/www/html:ro
      - ./ai-bridge/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [tokenforge]

  # Vite needs PHP too (the wayfinder plugin shells out to `php artisan
  # wayfinder:generate`), so it reuses the app image instead of a plain
  # Node image.
  vite:
    build:
      context: ./ai-bridge
      dockerfile: Dockerfile
    container_name: tokenforge_vite
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    env_file:
      - ./ai-bridge/.env
    environment:
      RUN_MIGRATIONS: "false"
      RUN_NPM_INSTALL: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./ai-bridge:/var/www/html
      - ai_bridge_vendor:/var/www/html/vendor
      - ai_bridge_node_modules:/var/www/html/node_modules
    depends_on:
      app:
        condition: service_started
    networks: [tokenforge]

  queue:
    build:
      context: ./ai-bridge
      dockerfile: Dockerfile
    container_name: tokenforge_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5"]
    env_file:
      - ./ai-bridge/.env
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./ai-bridge:/var/www/html
      - ai_bridge_vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started
    networks: [tokenforge]

  # --- Data stores ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tokenforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tokenforge}
      POSTGRES_USER: ${POSTGRES_USER:-tokenforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokenforge}
    # No published port: nothing outside this project's own containers
    # needs to reach Postgres directly — it's reachable internally as
    # postgres:5432. Use `docker compose exec postgres psql ...` if you
    # need a shell into it.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokenforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tokenforge]

  redis:
    image: redis:7-alpine
    container_name: tokenforge_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tokenforge]

  # --- Embeddings (RAG) ---
  ollama:
    image: ollama/ollama:latest
    container_name: tokenforge_ollama
    restart: unless-stopped
    # No published port: only `app`/`queue` need this, internally as
    # ollama:11434. (Also avoids clashing with any other Ollama that
    # might already be running on the host — see
    # docs/13-production-deployment.md.)
    volumes:
      - ollama_data:/root/.ollama
    networks: [tokenforge]

  # One-shot: pulls the embedding model on first boot, then exits.
  ollama-init:
    image: ollama/ollama:latest
    container_name: tokenforge_ollama_init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 2; done;
        ollama pull nomic-embed-text
    networks: [tokenforge]

  # --- Gemini bridge (internal only, not published to the internet) ---
  webai:
    build:
      context: ./WebAI-to-API
    container_name: tokenforge_webai
    restart: unless-stopped
    env_file:
      - ./WebAI-to-API/.env
    environment:
      PYTHONPATH: /app/src
      PLAYWRIGHT_HEADLESS: "true"
    # No published port: `app` reaches this internally as webai:6969
    # regardless. Use `docker compose exec webai ...` for debugging.
    volumes:
      - ./WebAI-to-API/config.conf:/app/config.conf:ro
      - ./WebAI-to-API/runtime:/app/runtime
    networks: [tokenforge]

networks:
  tokenforge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  ai_bridge_vendor:
  ai_bridge_node_modules:
